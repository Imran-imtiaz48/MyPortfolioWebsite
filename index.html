<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForestCrazy Profile</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

    <!-- MDB CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/4.1.0/mdb.min.css" rel="stylesheet" />

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }

        .typewriter {
            overflow: hidden;
            border-right: 0.15em solid orange;
            white-space: nowrap;
            letter-spacing: 0.15em;
            animation: typing 3.5s steps(30, end) forwards, blink-caret 0.5s step-end infinite;
            opacity: 0;
            width: min-content;
        }

        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 100%;
                opacity: 1;
            }
        }

        @keyframes blink-caret {
            from,
            to {
                border-color: transparent;
            }
            50% {
                border-color: orange;
            }
        }

        .navbar-nav .nav-item a {
            padding: 0.5rem 1rem;
            color: #6c757d;
            text-decoration: none;
            font-weight: 500;
        }

        .navbar-nav .nav-item a.active {
            color: #6f42c1; /* Purple color for active link */
        }

        .container {
            margin-top: 2rem;
        }

        .section img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light shadow-0">
        <div class="container-fluid">
            <!-- Toggle Button -->
            <button class="navbar-toggler" type="button" data-mdb-toggle="collapse" data-mdb-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Collapsible Menu -->
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="active" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="about.html">About Me</a>
                    </li>
                    <li class="nav-item">
                        <a href="skills.html">Skills</a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="section">
            <div class="row align-items-center">
                <!-- Left Section -->
                <div class="col-xl-6">
                    <div class="text-container">
                        <p class="fs-2 animate__animated animate__fadeInRight">Hi there 👋</p>
                        <p class="fs-1 fw-bold animate__animated animate__fadeInRight">I am Toon - aka ForestCrazy</p>
                        <div class="typewriter">
                            > <span>Backend Developer</span>
                        </div>
                    </div>
                </div>

                <!-- Right Section -->
                <div class="col-xl-6">
                    <img src="./img/banner-image.png" alt="Programmer Coding" />
                </div>
            </div>
        </div>
    </div>

    <!-- MDB JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/4.1.0/mdb.min.js"></script>
</body>

</html>
